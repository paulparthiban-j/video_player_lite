name: next_gen_video_player
description: "Parthi Play - Professional video playback app with advanced features."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Playback (libmpv with hardware decoding)
  media_kit: ^1.2.6
  media_kit_video: ^1.3.1
  media_kit_libs_video: ^1.0.7
  floating: ^6.0.0

  # State management
  flutter_riverpod: ^2.6.1

  # Storage, files and permissions
  file_picker: ^8.3.7
  path: ^1.9.1
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  photo_manager: ^3.8.3
  shared_preferences: ^2.5.4

  # Media tooling
  # "min" build: stream-copy cutting needs no external codecs (~28 MB
  # smaller per ABI than full-gpl).
  ffmpeg_kit_flutter_new_min: ^3.6.2
  video_thumbnail: ^0.5.3

  # Networking and streaming
  http: ^1.6.0
  youtube_explode_dart: ^2.3.6

  # Cryptography (vault)
  crypto: ^3.0.7
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  # Platform integration
  device_info_plus: ^12.3.0
  receive_sharing_intent: ^1.8.1
  share_plus: ^10.1.3
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/images/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/streams.json

