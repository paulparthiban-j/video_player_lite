# Static analysis configuration for Parthi Play.
#
# Builds on the Flutter recommended lint set and adds rules that catch real
# defects (leaked subscriptions, fire-and-forget async, unsafe casts) rather
# than purely stylistic preferences. CI runs `flutter analyze --fatal-infos`,
# so every diagnostic here must be fixed or explicitly suppressed.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  language:
    strict-casts: false
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    dead_code: warning

linter:
  rules:
    - always_declare_return_types
    - avoid_empty_else
    - avoid_relative_lib_imports
    - avoid_type_to_string
    - avoid_void_async
    - cancel_subscriptions
    - close_sinks
    - no_adjacent_strings_in_list
    - prefer_final_fields
    - prefer_final_locals
    - test_types_in_equals
    - throw_in_finally
    - unnecessary_await_in_return
    - unnecessary_statements
    - unawaited_futures
