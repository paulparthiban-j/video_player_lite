org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.caching=true
org.gradle.parallel=true
android.useAndroidX=true
android.enableJetifier=true
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process

# Some Flutter plugins compile Java for 1.8 while Kotlin defaults to the JDK
# version. The bytecode mix is fine on Android (D8 desugars it), so report
# the mismatch instead of failing the build.
kotlin.jvm.target.validation.mode=warning
